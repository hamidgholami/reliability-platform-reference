[defaults]
collections_path = .cache/ansible/collections
interpreter_python = auto_silent
local_tmp = .cache/ansible/tmp
retry_files_enabled = false
roles_path = ansible/roles

# Broad tags are intentionally not part of Phase 1. The small, ordered
# playbooks and explicit Make targets are the supported execution boundaries.

[inventory]
enable_plugins = yaml
