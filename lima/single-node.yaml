minimumLimaVersion: 2.2.0
vmType: vz
arch: aarch64
cpus: 2
memory: 4GiB
disk: 30GiB

images:
  - location: https://cloud.debian.org/images/cloud/trixie/20260712-2537/debian-13-genericcloud-arm64-20260712-2537.qcow2
    arch: aarch64
    digest: sha512:8543d795f2fde630eb66c492f245a8c1da19dedc636e0a8e7b3d0f95920e1a05aa911ef2d82d177d41cc53ced5fccbd2a3945d07fa5e15018914c4d864bb07ed

mounts: []

containerd:
  system: false
  user: false

# Debian 13's systemd 257.13 can miss its generated VSOCK SSH socket during
# early boot. Use Lima's supported TCP forwarding path until Debian ships the
# upstream generator fix.
ssh:
  overVsock: false

# Keep the Incus API private to the workstation. P1-05 uses this stable local
# endpoint instead of privileged vmnet networking or a routable guest address.
portForwards:
  - guestPort: 8443
    hostIP: 127.0.0.1
    hostPort: 18443
    proto: tcp
