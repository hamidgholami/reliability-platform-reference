# These exceptions preserve capabilities required by a standalone Incus host.
# Keep them narrow and revisit them when the host contract changes.
sysctl_overwrite:
  net.ipv4.ip_forward: 1
  net.ipv4.conf.all.forwarding: 1

# Incus images may use SquashFS. The upstream role disables unused filesystem
# modules unless they are explicitly retained.
os_filesystem_whitelist:
  - squashfs

# Let Incus own its nftables namespace and bridge rules instead of changing UFW
# defaults underneath it.
ufw_manage_defaults: false

# Protect the active automation identity from generic account-aging changes.
os_ignore_users:
  - "{{ debian_prepare_operator_user }}"
os_ignore_home_folder_users:
  - "{{ debian_prepare_operator_user }}"
os_users_without_password_ageing:
  - "{{ debian_prepare_operator_user }}"

# Harden the server only. Local TCP forwarding retains a bounded route to the
# Incus API without enabling remote forwarding, agent forwarding, or tunneling.
ssh_client_hardening: false
ssh_server_hardening: true
# This is the target-side listener. ansible_port may instead be a controller-
# side NAT or forwarding port, as it is for the Lima profile.
ssh_server_ports:
  - "22"
ssh_listen_to:
  - 0.0.0.0
ssh_server_password_login: false
ssh_permit_root_login: "no"
ssh_pubkey_authentication: true
sshd_authenticationmethods: publickey
ssh_allow_tcp_forwarding: local
ssh_gateway_ports: false
ssh_allow_agent_forwarding: false
ssh_x11_forwarding: false
network_ipv6_enable: true

# The baseline validator runs both before and after Incus bootstrap. The API
# port may be absent before P1-03 and is an expected host requirement afterward.
debian_baseline_expected_tcp_ports:
  - 22
  - "{{ incus_host_api_port }}"

# P1-03 installs only the Debian-native container daemon. OpenTofu owns all
# storage, network, project, profile, and instance resources in P1-05.
incus_host_mode: standalone
incus_host_package: incus-base
incus_host_operator_user: "{{ ansible_user }}"
incus_host_package_version_pattern: '^6\.0\.'
incus_host_storage_owner: opentofu
incus_host_storage_source: ""
incus_host_api_address: 0.0.0.0
incus_host_api_port: 8443
incus_host_expected_exposed_tcp_ports:
  - 22
  - "{{ incus_host_api_port }}"
incus_host_preseed_schema_version: 1
incus_host_minimum_root_available_bytes: 2147483648
incus_host_require_controller_api: >-
  {{ rpr_deployment_profile == 'single-node-reference' }}
