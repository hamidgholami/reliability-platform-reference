# OpenTofu generates the real ignored inventory after creating the P2-02
# substrate. Bootstrap TLS material is supplied separately at runtime.
all:
  children:
    openbao_service:
      vars:
        ansible_connection: community.general.incus
        ansible_incus_remote: replace-with-reviewed-remote
        ansible_incus_project: rpr-dev
        ansible_user: root
        rpr_deployment_profile: workstation-validation
        openbao_platform_cidr: 10.20.0.0/24
        openbao_api_address: 10.20.0.20
        openbao_api_port: 8200
        openbao_api_dns_name: openbao.dev.apadanalab.de
      hosts:
        bao-01:
          ansible_host: bao-01
    machine_auth_client:
      vars:
        ansible_connection: community.general.incus
        ansible_incus_remote: replace-with-reviewed-remote
        ansible_incus_project: rpr-dev
        ansible_user: root
        rpr_deployment_profile: workstation-validation
      hosts:
        smoke-01:
          ansible_host: smoke-01
    postgresql_service:
      vars:
        ansible_connection: community.general.incus
        ansible_incus_remote: replace-with-reviewed-remote
        ansible_incus_project: rpr-dev
        ansible_user: root
        rpr_deployment_profile: workstation-validation
        postgresql_private_address: 10.20.0.21
        postgresql_private_dns_name: pg-01.dev.apadanalab.de
        postgresql_listen_port: 5432
        postgresql_client_address: replace-with-generated-smoke-ipv4
        postgresql_openbao_address: 10.20.0.20
      hosts:
        pg-01:
          ansible_host: pg-01
    ssh_test_target:
      vars:
        ansible_connection: community.general.incus
        ansible_incus_remote: replace-with-reviewed-remote
        ansible_incus_project: rpr-dev
        ansible_user: root
        rpr_deployment_profile: workstation-validation
        ssh_test_private_address: 10.20.0.221
        ssh_test_private_dns_name: ssh-test-01.dev.apadanalab.de
        ssh_test_client_address: replace-with-generated-smoke-ipv4
      hosts:
        ssh-test-01:
          ansible_host: ssh-test-01
