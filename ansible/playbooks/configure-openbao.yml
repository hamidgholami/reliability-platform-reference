- name: Make Python available in the OpenBao service container
  hosts: openbao_service
  gather_facts: false
  any_errors_fatal: true
  become: false
  tasks:
    - name: Check Python and the APT binding
      ansible.builtin.raw: /usr/bin/python3 -c 'import apt'
      register: openbao_python_probe
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Install Python when absent
      ansible.builtin.raw: >-
        apt-get update && DEBIAN_FRONTEND=noninteractive
        apt-get install -y python3 python3-apt
      when: openbao_python_probe.rc != 0
      changed_when: true

- name: Configure the private OpenBao service
  hosts: openbao_service
  gather_facts: true
  any_errors_fatal: true
  become: false
  roles:
    - role: openbao_service
      vars:
        openbao_service_platform_cidr: "{{ openbao_platform_cidr }}"
        openbao_service_api_address: "{{ openbao_api_address }}"
        openbao_service_api_port: "{{ openbao_api_port }}"
        openbao_service_api_dns_name: "{{ openbao_api_dns_name }}"
