- name: Prepare the OpenBao-held online intermediate
  hosts: openbao_service
  gather_facts: false
  any_errors_fatal: true
  become: false
  roles:
    - role: openbao_pki
      vars:
        openbao_pki_action: prepare
        openbao_pki_api_address: "{{ openbao_api_address }}"
        openbao_pki_api_port: "{{ openbao_api_port }}"
        openbao_pki_api_dns_name: "{{ openbao_api_dns_name }}"
