- name: Bootstrap scoped OpenBao configuration
  hosts: openbao_service
  gather_facts: false
  any_errors_fatal: true
  become: false
  roles:
    - role: openbao_bootstrap
      vars:
        openbao_bootstrap_api_address: "{{ openbao_api_address }}"
        openbao_bootstrap_api_port: "{{ openbao_api_port }}"
        openbao_bootstrap_api_dns_name: "{{ openbao_api_dns_name }}"
