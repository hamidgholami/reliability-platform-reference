- name: Update the APT package index
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ debian_prepare_apt_cache_valid_time }}"
  check_mode: false

- name: Apply available package upgrades
  ansible.builtin.apt:
    upgrade: safe
  when: debian_prepare_apply_upgrades | bool

- name: Install approved baseline packages
  ansible.builtin.apt:
    name: "{{ debian_prepare_packages }}"
    state: present

- name: Enable required baseline services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - apparmor
    - chrony
  when: not ansible_check_mode
