- name: Wait for the local Incus daemon
  ansible.builtin.command: incus admin waitready --timeout=60
  changed_when: false

- name: Query structured local Incus API health
  ansible.builtin.command:
    argv:
      - incus
      - query
      - --raw
      - /1.0
  register: incus_host_api_query
  changed_when: false

- name: Decode Incus API health
  ansible.builtin.set_fact:
    incus_host_api_health: "{{ incus_host_api_query.stdout | from_json }}"

- name: Query the local Incus API as the SSH operator
  ansible.builtin.command:
    argv:
      - incus
      - query
      - --raw
      - /1.0
  register: incus_host_operator_api_query
  become: false
  changed_when: false

- name: Decode SSH operator Incus API access
  ansible.builtin.set_fact:
    incus_host_operator_api_health: >-
      {{ incus_host_operator_api_query.stdout | from_json }}

- name: Read installed Incus package version
  ansible.builtin.command:
    argv:
      - dpkg-query
      - --show
      - "--showformat=${Version}"
      - "{{ incus_host_package }}"
  register: incus_host_installed_version
  changed_when: false

- name: Read effective Incus API listen address
  ansible.builtin.command: incus config get core.https_address
  register: incus_host_effective_api_address
  changed_when: false

- name: Inspect the Incus socket state
  ansible.builtin.systemd_service:
    name: incus.socket
  register: incus_host_socket_unit

- name: Inspect the Incus daemon state
  ansible.builtin.systemd_service:
    name: incus.service
  register: incus_host_service_unit

- name: Validate the local HTTPS API endpoint
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ incus_host_api_port }}/1.0"
    method: GET
    status_code: 200
    validate_certs: false
    return_content: true
  register: incus_host_local_https

- name: Read listening TCP sockets after Incus initialization
  ansible.builtin.command: ss -H -lnt
  register: incus_host_listening_tcp
  changed_when: false

- name: Select exposed TCP listeners after Incus initialization
  ansible.builtin.set_fact:
    incus_host_exposed_tcp_lines: >-
      {{ incus_host_listening_tcp.stdout_lines
         | reject('search', '\s127\.[^ ]+:')
         | reject('search', '\s\[::1\]:')
         | list }}

- name: Derive exposed TCP ports after Incus initialization
  ansible.builtin.set_fact:
    incus_host_exposed_tcp_ports: >-
      {{ incus_host_exposed_tcp_lines
         | map('regex_search', ':[0-9]+')
         | reject('equalto', none)
         | map('regex_replace', '^:', '')
         | map('int') | unique | sort | list }}

- name: Query Incus storage pools
  ansible.builtin.command:
    argv:
      - incus
      - query
      - --raw
      - /1.0/storage-pools
  register: incus_host_storage_pools_query
  changed_when: false

- name: Query Incus networks
  ansible.builtin.command:
    argv:
      - incus
      - query
      - --raw
      - /1.0/networks?recursion=1
  register: incus_host_networks_query
  changed_when: false

- name: Query Incus projects
  ansible.builtin.command:
    argv:
      - incus
      - query
      - --raw
      - /1.0/projects
  register: incus_host_projects_query
  changed_when: false

- name: Query Incus profiles
  ansible.builtin.command:
    argv:
      - incus
      - query
      - --raw
      - /1.0/profiles
  register: incus_host_profiles_query
  changed_when: false

- name: Query the built-in default Incus profile
  ansible.builtin.command:
    argv:
      - incus
      - query
      - --raw
      - /1.0/profiles/default
  register: incus_host_default_profile_query
  changed_when: false

- name: Query Incus instances
  ansible.builtin.command:
    argv:
      - incus
      - query
      - --raw
      - /1.0/instances
  register: incus_host_instances_query
  changed_when: false

- name: Decode the provider resource boundary
  ansible.builtin.set_fact:
    incus_host_storage_pools: >-
      {{ (incus_host_storage_pools_query.stdout | from_json).metadata |
         default([], true) }}
    incus_host_managed_networks: >-
      {{ (incus_host_networks_query.stdout | from_json).metadata |
         selectattr('managed') | list }}
    incus_host_projects: >-
      {{ (incus_host_projects_query.stdout | from_json).metadata }}
    incus_host_profiles: >-
      {{ (incus_host_profiles_query.stdout | from_json).metadata }}
    incus_host_default_profile: >-
      {{ (incus_host_default_profile_query.stdout | from_json).metadata }}
    incus_host_instances: >-
      {{ (incus_host_instances_query.stdout | from_json).metadata |
         default([], true) }}

- name: Assert standalone Incus health boundary
  ansible.builtin.assert:
    that:
      - incus_host_installed_version.stdout is match(incus_host_package_version_pattern)
      - >-
        incus_host_effective_api_address.stdout | trim ==
        incus_host_api_address ~ ':' ~ incus_host_api_port
      - incus_host_api_health.type == 'sync'
      - incus_host_api_health.status == 'Success'
      - incus_host_api_health.metadata.auth == 'trusted'
      - not incus_host_api_health.metadata.environment.server_clustered | bool
      - incus_host_operator_api_health.type == 'sync'
      - incus_host_operator_api_health.metadata.auth == 'trusted'
      - incus_host_socket_unit.status.ActiveState == 'active'
      - incus_host_socket_unit.status.UnitFileState == 'enabled'
      - incus_host_service_unit.status.ActiveState == 'active'
      - (incus_host_local_https.content | from_json).type == 'sync'
      - incus_host_storage_pools | length == 0
      - incus_host_managed_networks | length == 0
      - incus_host_projects == ['/1.0/projects/default']
      - incus_host_profiles == ['/1.0/profiles/default']
      - incus_host_default_profile.config | length == 0
      - incus_host_default_profile.devices | length == 0
      - incus_host_instances | length == 0
      - >-
        (incus_host_exposed_tcp_ports |
        difference(incus_host_expected_exposed_tcp_ports | flatten | map('int') | list) |
        length) == 0
      - >-
        (incus_host_required_exposed_tcp_ports | map('int') |
        difference(incus_host_exposed_tcp_ports) | length) == 0

- name: Check Incus API reachability from the controller
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: "{{ incus_host_api_port }}"
    connect_timeout: 5
    timeout: 60
  delegate_to: localhost
  become: false
  when: incus_host_require_controller_api | bool

- name: Read Incus server certificate fingerprint
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -in
      - /var/lib/incus/server.crt
      - -noout
      - -fingerprint
      - -sha256
  register: incus_host_server_fingerprint
  changed_when: false

- name: Create ignored local Incus evidence directory
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../../reports/p1-03"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Write bounded Incus validation evidence locally
  ansible.builtin.copy:
    dest: >-
      {{ playbook_dir }}/../../reports/p1-03/{{ inventory_hostname |
      regex_replace('[^A-Za-z0-9_.-]', '_') }}.json
    mode: "0600"
    content: >-
      {{ {
        'schema_version': 1,
        'target': inventory_hostname,
        'deployment_profile': rpr_deployment_profile,
        'package': incus_host_package,
        'package_version': incus_host_installed_version.stdout,
        'api_version': incus_host_api_health.metadata.api_version,
        'server_version': incus_host_api_health.metadata.environment.server_version,
        'server_clustered': incus_host_api_health.metadata.environment.server_clustered,
        'https_address': incus_host_effective_api_address.stdout | trim,
        'exposed_tcp_ports': incus_host_exposed_tcp_ports,
        'ssh_operator_api_access_verified': true,
        'controller_api_reachability_required': incus_host_require_controller_api,
        'server_certificate_sha256': incus_host_server_fingerprint.stdout,
        'preseed_transport': 'stdin',
        'provider_boundary_verified': true,
        'provider_resource_counts': {
          'storage_pools': incus_host_storage_pools | length,
          'managed_networks': incus_host_managed_networks | length,
          'non_default_projects': (incus_host_projects | length) - 1,
          'non_default_profiles': (incus_host_profiles | length) - 1,
          'instances': incus_host_instances | length
        }
      } | to_nice_json }}
  delegate_to: localhost
  become: false
